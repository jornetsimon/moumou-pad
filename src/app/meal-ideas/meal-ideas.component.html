<div tuiHeader="l" class="mb-4">
	<h3 tuiTitle>Mes recettes</h3>
</div>

<tui-input
	[formControl]="searchCtrl"
	[tuiTextfieldCleaner]="true"
	[tuiTextfieldIconLeft]="searchIconContent"
	class="mb-4"
>
	Rechercher
	<input
		placeholder="Nom de recette..."
		tuiTextfield
		autocomplete="off"
		inputmode="search"
		(keydown.enter)="blurTarget($event)"
	/>
</tui-input>

<ng-template #searchIconContent>
	<tui-loader [showLoader]="isLoading() || isLoadingMore()">
		@if (!isLoading() && !isLoadingMore()) {
			<tui-svg src="tuiIconSearchLarge"></tui-svg>
		}
	</tui-loader>
</ng-template>

@if (isLoading()) {
	<div class="flex flex-col gap-4">
		<div class="h-[100px] w-full" *tuiRepeatTimes="let index of 3" [tuiSkeleton]="true"></div>
	</div>
} @else {
	<cdk-virtual-scroll-viewport
		[itemSize]="itemSize"
		[style.height.px]="viewportHeight()"
		class="idea-list"
	>
		<div
			*cdkVirtualFor="let idea of ideas(); trackBy: trackByName"
			tuiSurface="elevated"
			class="idea-container"
			(click)="useIdea(idea)"
		>
			@if (idea.image) {
				<a
					[href]="idea.notionPageDeeplink"
					target="_blank"
					class="w-1/4"
					(click)="$event.stopPropagation()"
				>
					<img
						[alt]="idea.name"
						[src]="idea.image"
						[style.border-radius.rem]="0.5"
						class="object-cover"
					/>
				</a>
			}

			<div class="grow px-4 py-4 flex items-center gap-4">
				<div class="grow flex flex-col flex-wrap gap-[0.15rem]">
					<div>
						<a
							class="idea-name"
							[href]="idea.notionPageDeeplink"
							target="_blank"
							(click)="$event.stopPropagation()"
						>
							{{ idea.name }}
						</a>
						<span class="rating text-sm ml-2">
							@if (idea.rating > 0) {
								<span
									class="rating-icon bg-green-100"
									*tuiRepeatTimes="let index of idea.absoluteRating"
								>
									👍
								</span>
							} @else {
								<span
									class="rating-icon bg-red-100"
									*tuiRepeatTimes="let index of idea.absoluteRating"
								>
									👎
								</span>
							}
						</span>
					</div>

					<div class="flex items-center gap-2">
						@for (tag of idea.tags; track tag.name) {
							<tui-tag
								status="custom"
								[hoverable]="false"
								[value]="tag.name"
								[ngStyle]="{
									'background-color': tag.color,
									color:
										'#fff'
										| toReadableTextColor: tag.color : 'decorative' : '#000'
								}"
							></tui-tag>
						}
					</div>

					@if (idea.url) {
						<a class="text-gray-500" [href]="idea.url">{{ idea.url | urlPreview }}</a>
					}
				</div>
			</div>

			<div class="shrink-0 grow-0 aligner">
				<button
					class="submit-button"
					appearance="secondary"
					size="s"
					tuiIconButton
					icon="tuiIconChevronsRight"
					type="button"
					(click)="useIdea(idea)"
				></button>
			</div>
		</div>

		@if (isLoadingMore()) {
			<div class="h-[100px] w-full" [tuiSkeleton]="true"></div>
		}
	</cdk-virtual-scroll-viewport>
}
